<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Live Map</title>

    <link rel="stylesheet" href="leaflet.css"/>
    <script src="leaflet.js"></script>

	<style>
		html, body {
			height: 100%;
			margin: 0;
		}
	</style>
</head>
<body>

<div id="map" style="width: 730px; height: 450px;"></div>
<script>
	var map = L.map('map').setView([57.6919675, 11.9721758], 15);

	var tiles = L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	var markers = {};
	layerGroups = {
		'tram': L.layerGroup().addTo(map),
		'bus': L.layerGroup().addTo(map),
		'ferry': L.layerGroup().addTo(map),
		'train': L.layerGroup().addTo(map)
	};
	var layerControl = L.control.layers().addTo(map);
	layerControl.addOverlay(layerGroups['tram'], 'Spårvagn');
    layerControl.addOverlay(layerGroups['bus'], 'Buss');
    layerControl.addOverlay(layerGroups['ferry'], 'Färja');
    layerControl.addOverlay(layerGroups['train'], 'Tåg');

	// Moves known vehicles, adds new ones and removes the ones no longer reported
	function updateVehicles(vehicles) {
		var seen = {};
		vehicles.forEach(function(vehicle) {
			var id = vehicle.detailsReference;
			var group = layerGroups[vehicle.line.transportMode];
			if (!group) return; // A transport mode without a layer
			seen[id] = true;
			if (id in markers) {
				markers[id].setLatLng([vehicle.latitude, vehicle.longitude]);
			} else {
				var icon = L.divIcon({html: `<div style="border: 1px solid transparent; border-radius: 0.25rem;
					color: ${vehicle.line.foregroundColor}; background-color: ${vehicle.line.backgroundColor}; width: fit-content;
					height: fit-content; text-align: center; font-weight: bold;
					min-height: 1rem; min-width: 1rem;">${vehicle.line.name}</div>`});
				markers[id] = L.marker([vehicle.latitude, vehicle.longitude], {icon: icon}).addTo(group);
			}
		});
		for (var id in markers) {
			if (!(id in seen)) {
				Object.values(layerGroups).forEach(function(group) { group.removeLayer(markers[id]); });
				delete markers[id];
			}
		}
	}
</script>

</body>
</html>
